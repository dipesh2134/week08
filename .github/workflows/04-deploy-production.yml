name: 04 - Deploy to Production

# =========================================================
# Continuous Deployment (Task 9.3C)
#
# Previously this workflow used workflow_dispatch and required a
# tester to supply the image tag by hand. It now runs automatically
# whenever the staging smoke test ("03 - Test Staging") completes
# successfully on main, completing the automated promotion chain:
#
#   01 - CI  ->  02 - Deploy to Staging  ->  03 - Test Staging  ->  04 - Deploy to Production
#
# The image tag is taken from github.event.workflow_run.head_sha,
# which is the same commit SHA that CI built and pushed, so the exact
# artefact that passed the staging test is the one promoted.
# =========================================================

on:
  workflow_run:
    workflows:
      - "03 - Test Staging"
    types:
      - completed
    branches:
      - main

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest

    # Only promote when the staging test actually passed
    if: >
      ${{ github.event.workflow_run.conclusion == 'success' }}

    environment:
      name: production

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group sit722-rg \
            --name sit722week08 \
            --overwrite-existing

      - name: Create production namespace
        run: |
          kubectl create namespace production \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Create PostgreSQL secret
        run: |
          kubectl create secret generic postgres-secret \
            --namespace production \
            --from-literal=POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Create application secret
        run: |
          kubectl create secret generic application-secret \
            --namespace production \
            --from-literal=POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --from-literal=JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}" \
            --from-literal=DEFAULT_ADMIN_USERNAME="${{ secrets.DEFAULT_ADMIN_USERNAME }}" \
            --from-literal=DEFAULT_ADMIN_EMAIL="${{ secrets.DEFAULT_ADMIN_EMAIL }}" \
            --from-literal=DEFAULT_ADMIN_PASSWORD="${{ secrets.DEFAULT_ADMIN_PASSWORD }}" \
            --from-literal=AZURE_STORAGE_CONNECTION_STRING="${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply \
            -f kubernetes/production/

      - name: Update frontend image
        run: |
          kubectl set image deployment/frontend \
            frontend=dipeshsit722acr.azurecr.io/koalatech-frontend:${{ github.event.workflow_run.head_sha }} \
            -n production

      - name: Update user-service image
        run: |
          kubectl set image deployment/user-service \
            user-service=dipeshsit722acr.azurecr.io/koalatech-user-service:${{ github.event.workflow_run.head_sha }} \
            -n production

      - name: Update student-service image
        run: |
          kubectl set image deployment/student-service \
            student-service=dipeshsit722acr.azurecr.io/koalatech-student-service:${{ github.event.workflow_run.head_sha }} \
            -n production

      - name: Update lecturer-service image
        run: |
          kubectl set image deployment/lecturer-service \
            lecturer-service=dipeshsit722acr.azurecr.io/koalatech-lecturer-service:${{ github.event.workflow_run.head_sha }} \
            -n production

      - name: Update course-service image
        run: |
          kubectl set image deployment/course-service \
            course-service=dipeshsit722acr.azurecr.io/koalatech-course-service:${{ github.event.workflow_run.head_sha }} \
            -n production

      - name: Update enrollment-service image
        run: |
          kubectl set image deployment/enrollment-service \
            enrollment-service=dipeshsit722acr.azurecr.io/koalatech-enrollment-service:${{ github.event.workflow_run.head_sha }} \
            -n production

      - name: Wait for frontend rollout
        run: |
          kubectl rollout status deployment/frontend \
            -n production \
            --timeout=300s

      - name: Wait for user-service rollout
        run: |
          kubectl rollout status deployment/user-service \
            -n production \
            --timeout=300s

      - name: Wait for student-service rollout
        run: |
          kubectl rollout status deployment/student-service \
            -n production \
            --timeout=300s

      - name: Wait for lecturer-service rollout
        run: |
          kubectl rollout status deployment/lecturer-service \
            -n production \
            --timeout=300s

      - name: Wait for course-service rollout
        run: |
          kubectl rollout status deployment/course-service \
            -n production \
            --timeout=300s

      - name: Wait for enrollment-service rollout
        run: |
          kubectl rollout status deployment/enrollment-service \
            -n production \
            --timeout=300s

      - name: Show production resources
        run: |
          kubectl get pods -n production
          kubectl get services -n production
          kubectl get pvc -n production

      - name: Show deployed image tag
        run: |
          echo "Promoted commit: ${{ github.event.workflow_run.head_sha }}"
          kubectl get deployment frontend \
            -n production \
            -o jsonpath='{.spec.template.spec.containers[0].image}'
